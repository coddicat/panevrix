<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="commander-token" content="__TOKEN__"><title>Panevrix — File workspace</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/system.css"></head>
<body>
<aside class="rail"><a class="brand" href="/" title="Panevrix">P<span>_</span></a><button class="rail-button active" title="File workspace">▦</button><button class="rail-button" id="favorites-button" title="Favorites">☆</button><button class="rail-button" id="trash-button" title="Recover deleted files">♲</button><div class="rail-bottom"><button class="rail-button" id="settings-button" title="Settings">⚙</button><button class="rail-button" id="help-button" title="Keyboard shortcuts">?</button></div></aside>
<main>
<header class="topbar"><div><span class="eyebrow">TWO PANELS. TOTAL CONTROL.</span><h1>Panevrix<span class="version">1.0</span></h1></div><div class="top-actions"><span class="local-badge"><i></i> Local filesystem</span><button id="system-monitor" class="button primary system-monitor-launch">▥ System monitor</button><button id="terminal-toggle" class="button">⌘ <span>Command bar</span></button><button id="help-top" class="button">Shortcuts <kbd>F1</kbd></button></div></header>
<section class="toolbar"><div class="toolbar-group"><button id="new-folder" class="button">▣ New folder <kbd>F7</kbd></button><button id="new-file" class="button">＋ New file</button><span class="divider"></span><button id="copy" class="button">⧉ Copy</button><button id="move" class="button">⇥ Move</button><button id="rename" class="button">✎ Rename</button><button id="delete" class="button danger">⌫ Delete</button></div><div class="toolbar-group"><button id="sync" class="icon-button" title="Open active folder in other panel">⇄</button><button id="refresh" class="icon-button" title="Refresh (Ctrl+R)">↻</button><button id="search" class="button">⌕ Search <kbd>Shift+F7</kbd></button></div></section>
<div class="viewer-tools"><button id="details-toggle" class="button" aria-pressed="false">ⓘ Information <kbd>Ctrl+I</kbd></button><button id="hex-view" class="button">‹01› Hex view <kbd>Shift+F3</kbd></button></div>
<section id="folder-loads" class="folder-loads" aria-label="Folder loading" hidden></section>
<section id="panels" class="panels" aria-label="File panels"></section>
<section id="terminal" class="terminal" hidden><div class="terminal-heading"><span>COMMAND OUTPUT</span><button id="clear-output">Clear</button><button id="close-terminal">×</button></div><pre id="command-output">Commands run in the active panel’s folder. Each command starts a new shell.</pre><form id="command-form"><span class="prompt">❯</span><input id="command-input" autocomplete="off" placeholder="Enter a shell command…"><button class="button" type="submit">Run ↵</button></form></section>
<footer class="function-bar"><button data-action="help"><kbd>F1</kbd> Help</button><button data-action="rename"><kbd>F2</kbd> Rename</button><button data-action="view"><kbd>F3</kbd> View</button><button data-action="edit"><kbd>F4</kbd> Edit</button><button data-action="copy"><kbd>F5</kbd> Copy</button><button data-action="move"><kbd>F6</kbd> Move</button><button data-action="mkdir"><kbd>F7</kbd> Folder</button><button data-action="delete"><kbd>F8</kbd> Delete</button><button data-action="settings"><kbd>F9</kbd> Settings</button><button data-action="terminal"><kbd>F10</kbd> Command</button></footer>
<div class="bottom-status"><span><i class="status-dot"></i> <span id="global-status">Ready</span></span><span><kbd>Tab</kbd> Switch panels <span class="status-separator">·</span> <kbd>Space</kbd> Select <span class="status-separator">·</span> <kbd>Enter</kbd> Open</span><span id="clock"></span></div>
</main>
<dialog id="dialog"><div id="dialog-content"></div></dialog><div id="toast" role="status"></div>
<script src="/app.js"></script></body></html>
